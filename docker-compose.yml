services:
  postgres:
    image: postgres:17
    container_name: dropzone-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: dropzone
      POSTGRES_PASSWORD: dropzone
      POSTGRES_DB: dropzone

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: dropzone-minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: dropzone
      MINIO_ROOT_PASSWORD: dropzone123456

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

  redis:
    image: redis:7-alpine
    container_name: dropzone-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

volumes:
  postgres_data:
  minio_data:
  redis_data: